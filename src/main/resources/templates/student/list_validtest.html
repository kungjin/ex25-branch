<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생목록 [값검증]</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, 
    td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
    }

    th {
        background-color: #f4f4f4;
        color: #ffffff;
    }

    tr:hover {
        background-color: #f1f1f1;
    }

    .btn {
        display: inline-block;
        padding: 8px 16px;
        color: #fff;
        background-color: #28a745;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        cursor: pointer;
    }

    .btn-primary {
        background-color: #007bff;
    }

    .btn-warning {
        background-color: #ff9800;
    }
    .btn-danger {
        background-color: #dc3545;
    }   
    
    .btn:hover {
        opacity: 0.8;
        
    }
    h1 {
        color: #333333;
    }
</style>
</head>
<body>
    <h1>학생 목록</h1>
	<a href="/students/valid/new" class="btn btn-primary">새 학생 등록[값검증]</a>

	<table>
		<thead>
			<tr>
				<th>ID</th>
				<th>이름</th>
				<th>이메일</th>
				<th>나이</th>
				<th>생성일</th>
				<th>관리</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="student : ${students}">
				<td th:text="${student.id}"></td>
				<td th:text="${student.name}"></td>
				<td th:text="${student.email}"></td>
				<td th:text="${student.age}"></td>
				<td th:text="${#temporals.format(student.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
				<td>
					<a th:href="@{/students/valid/{id}/edit(id=${student.id})}" class="btn btn-warning">수정</a>
					<form th:action="@{/students/valid/{id}/delete(id=${student.id})}" method="post" style="display:inline;">
						<button type="submit" class="btn btn-danger"
							onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
